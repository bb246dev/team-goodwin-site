<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Updates Archive | Goodwin Generated Mission America</title>
  <link rel="stylesheet" href="../assets/styles-ulvf0Dcj.css">
  <style>
    body{margin:0;background:#fbfaf6;color:#143f3c;font-family:Inter,Arial,sans-serif}.page{min-height:100vh;padding:40px clamp(22px,5vw,72px)}a{color:inherit}.nav{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-family:Fraunces,Georgia,serif;font-size:clamp(1.4rem,3vw,2.4rem);text-decoration:none}.back{font-weight:700;text-decoration:none}.hero{padding:12vh 0 7vh}.eyebrow{color:#bca273;font-size:.72rem;font-weight:800;letter-spacing:.3em;text-transform:uppercase}h1{margin:.2em 0 0;font-family:Fraunces,Georgia,serif;font-size:clamp(4rem,12vw,10rem);line-height:.84;text-transform:uppercase}.updates{display:grid;gap:1px;background:rgba(20,63,60,.18);border:1px solid rgba(20,63,60,.18)}.update{display:grid;grid-template-columns:minmax(160px,.3fr) 1fr;gap:24px;background:rgba(255,255,255,.76);padding:24px}.update time{color:#bca273;font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.update h2{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(1.6rem,3vw,2.6rem);line-height:1}.update p{margin:10px 0 0;color:rgba(20,63,60,.68);line-height:1.6}@media(max-width:680px){.update{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav"><a class="brand" href="live-tracking.html">GOODWIN Generated</a><a class="back" href="live-tracking.html">Back to tracker</a></nav>
    <section class="hero"><div class="eyebrow">Ticker Archive</div><h1>All Updates</h1></section>
    <section class="updates" data-updates-archive>
      <article class="update"><time>Loading</time><div><h2>Fetching updates</h2><p>The archive will populate from the shared ticker data file.</p></div></article>
    </section>
  </main>
  <script>
    const sheetConfig={endpoint:"https://docs.google.com/spreadsheets/d/1o6AH6YNdbc0_WkhAvBG96Vv0KglEpoPPzFtce92zlqc/gviz/tq",gid:"0",cacheKey:"goodwin-generated-mission-america-updates-v1",cacheMs:2*60*1000};
    const updatesDebug=new URLSearchParams(window.location.search).get("updatesDebug")==="1";
    function esc(value){return String(value||"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function parseGoogleDate(value){const match=String(value||"").match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);if(!match)return Date.parse(value);return new Date(Number(match[1]),Number(match[2]),Number(match[3]),Number(match[4]||0),Number(match[5]||0),Number(match[6]||0)).getTime()}
    function googleCell(row,index,preferFormatted=true){const cell=row?.c?.[index];if(!cell)return "";if(preferFormatted&&cell.f!=null&&cell.f!=="")return cell.f;if(cell.v!=null)return cell.v;if(cell.f!=null)return cell.f;return ""}
    function validUrl(value){const raw=String(value||"").trim();if(!raw)return "";try{const url=new URL(raw,window.location.href);return url.protocol==="http:"||url.protocol==="https:"?url.href:""}catch(error){return ""}}
    function normalizeSheetUpdates(payload){const table=payload?.table;const columns=Array.isArray(table?.cols)?table.cols:[];const rows=Array.isArray(table?.rows)?table.rows:[];const headerIndex=new Map(columns.map((column,index)=>[String(column.label||"").trim(),index]));const required=["Date/Time","Headline","Update","Optional Link","Published"];if(!required.every((header)=>headerIndex.has(header)))throw new Error("Google Sheet update headers are missing or renamed.");return rows.map((row,index)=>{const dateTime=String(googleCell(row,headerIndex.get("Date/Time"))||"").trim();const rawDate=googleCell(row,headerIndex.get("Date/Time"),false);const title=String(googleCell(row,headerIndex.get("Headline"))||"").trim();const body=String(googleCell(row,headerIndex.get("Update"))||"").trim();const link=validUrl(googleCell(row,headerIndex.get("Optional Link")));const published=googleCell(row,headerIndex.get("Published"),false)===true||String(googleCell(row,headerIndex.get("Published"),false)||"").trim().toLowerCase()==="true";const sortValue=parseGoogleDate(rawDate||dateTime);return{dateTime,title,body,link,published,sortValue:Number.isFinite(sortValue)?sortValue:0,sourceIndex:index}}).filter((update)=>update.published&&(update.dateTime||update.title||update.body||update.link)).sort((a,b)=>(b.sortValue-a.sortValue)||(b.sourceIndex-a.sourceIndex))}
    function readCache(allowExpired=false){try{const cached=JSON.parse(localStorage.getItem(sheetConfig.cacheKey)||"null");if(!cached||!Array.isArray(cached.updates))return null;if(!allowExpired&&Date.now()-Number(cached.savedAt||0)>sheetConfig.cacheMs)return null;return cached.updates}catch(error){return null}}
    function writeCache(updates){try{localStorage.setItem(sheetConfig.cacheKey,JSON.stringify({savedAt:Date.now(),updates}))}catch(error){console.warn(error)}}
    function requestSheet(){return new Promise((resolve,reject)=>{const callbackName=`__goodwinMissionUpdates${Date.now()}${Math.random().toString(36).slice(2)}`;const params=new URLSearchParams({gid:sheetConfig.gid,tqx:`out:json;responseHandler:${callbackName}`,cacheBust:String(Date.now())});const script=document.createElement("script");const timeout=window.setTimeout(()=>{cleanup();reject(new Error("Google Sheet updates request timed out."))},10000);const cleanup=()=>{window.clearTimeout(timeout);delete window[callbackName];script.remove()};window[callbackName]=(payload)=>{cleanup();resolve(payload)};script.onerror=()=>{cleanup();reject(new Error("Google Sheet updates request failed."))};script.src=`${sheetConfig.endpoint}?${params.toString()}`;document.head.appendChild(script)})}
    async function loadUpdates({bypassCache=false}={}){const cached=updatesDebug||bypassCache?null:readCache();if(cached)return cached;try{const updates=normalizeSheetUpdates(await requestSheet());writeCache(updates);return updates}catch(error){console.warn(error);const stale=readCache(true);if(stale)return stale;throw error}}
    function renderTitle(update){if(!update.link)return esc(update.title);const url=new URL(update.link,window.location.href);const external=url.origin===window.location.origin?"":' target="_blank" rel="noopener noreferrer"';return `<a href="${esc(update.link)}"${external}>${esc(update.title)}</a>`}
    async function loadArchive(options={}){
      const container=document.querySelector("[data-updates-archive]");
      try{
        const updates=await loadUpdates(options);
        if(!updates.length){container.innerHTML='<article class="update"><time>Updates</time><div><h2>Updates from the road are coming.</h2></div></article>';return}
        container.innerHTML=updates.map((update)=>`<article class="update"><time>${esc(update.dateTime)}</time><div><h2>${renderTitle(update)}</h2><p>${esc(update.body)}</p></div></article>`).join("");
      }catch(error){
        container.innerHTML='<article class="update"><time>Updates</time><div><h2>Latest updates are temporarily unavailable.</h2></div></article>';
      }
    }
    loadArchive();
    window.setInterval(()=>loadArchive({bypassCache:true}),sheetConfig.cacheMs);
  </script>
</body>
</html>
