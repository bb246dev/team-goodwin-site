name: Audit live Garmin proxy file

on:
  push:
    branches: [codex/garmin-proxy-no-store-live]

permissions:
  contents: read

concurrency:
  group: garmin-proxy-live-fix
  cancel-in-progress: false

jobs:
  audit:
    name: Read deployed Garmin proxy SHA-256
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download and hash current production proxy
        env:
          NAMECHEAP_FTPS_HOST: ${{ secrets.NAMECHEAP_FTPS_HOST }}
          NAMECHEAP_FTPS_USERNAME: ${{ secrets.NAMECHEAP_FTPS_USERNAME }}
          NAMECHEAP_FTPS_PASSWORD: ${{ secrets.NAMECHEAP_FTPS_PASSWORD }}
          NAMECHEAP_FTPS_PORT: ${{ secrets.NAMECHEAP_FTPS_PORT }}
          NAMECHEAP_FTPS_BASE_PATH: ${{ vars.NAMECHEAP_FTPS_BASE_PATH }}
          DEPLOY_TEMP_ROOT: ${{ runner.temp }}/goodwin-garmin-audit-${{ github.run_id }}
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFile } from "node:fs/promises";
            import { createFtpsClient } from "./scripts/deploy/ftps-client.mjs";
            const localPath = process.env.RUNNER_TEMP + "/garmin-feed.production.php";
            await createFtpsClient(process.env).download("public_html/tracking-preview/garmin-feed.php", localPath);
            const digest = createHash("sha256").update(await readFile(localPath)).digest("hex");
            console.log(`LIVE_GARMIN_PROXY_SHA256=${digest}`);
            await import("node:fs/promises").then(({ appendFile }) => appendFile(process.env.GITHUB_STEP_SUMMARY, `Deployed garmin-feed.php SHA-256: \`${digest}\`\n`));
          '

      - name: Remove downloaded production file and credential temporary files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/garmin-feed.production.php" "$RUNNER_TEMP/goodwin-garmin-audit-$GITHUB_RUN_ID"
